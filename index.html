let الوضع="كلمات"; let الفهرس=0;
function عرض(){let ق=الوضع==="كلمات"?الكلمات:الجمل;let ع=ق[الفهرس];document.getElementById("arabic").innerText=ع.ar;document.getElementById("english").innerText=ع.en;document.getElementById("pron").innerText=ع.pron;document.getElementById("current").innerText=الفهرس+1;document.getElementById("total").innerText=ق.length;}

async function ترجمة_الصورة(e){let file=e.target.files[0];if(!file)return;let img=document.getElementById("preview");img.src=URL.createObjectURL(file);img.style.display="block";let res=document.getElementById("result");res.style.display="block";res.innerText="⏳ جاري قراءة الصورة...";try{let r=await Tesseract.recognize(file,'ara+eng');let نص=r.data.text.trim();if(!نص){res.innerText="لم نجد نصا في الصورة";return;}let isArabic=/[\u0600-\u06FF]/.test(نص);let من=isArabic?"ar":"en";let إلى=isArabic?"en":"ar";let tr=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(نص)}&langpair=${من}|${إلى}`).then(x=>x.json());let ترجمة=tr.responseData.translatedText;res.innerHTML=`<b>النص:</b> ${نص}<br><b>الترجمة:</b> ${ترجمة}`;}catch(err){res.innerText="حدث خطأ، حاول مرة أخرى";}}
