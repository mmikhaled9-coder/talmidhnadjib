<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موسوعة التلميذ النجيب</title>
<!-- مكتبة الصوت التي تعمل في الهاتف وماسنجر -->
<script src="https://code.responsivevoice.org/responsivevoice.js?key=1nYxXk7e"></script>
<!-- مكتبة قراءة النص من الصورة -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif;margin:0;padding:0}
body{background:#f7ead2;padding:0;padding-bottom:20px}
header{background:#ff6a00;color:#fff;text-align:center;padding:20px 10px 25px;border-radius:0 0 25px 25px}
header h1{font-size:24px}
header p{margin-top:8px;opacity:.9}
.card{background:#f1ede6;border:2px solid #ffcc00;border-radius:20px;margin:20px 15px;padding:25px 15px;text-align:center}
.card small{color:#e67e00;font-weight:bold}
.ar{font-size:42px;font-weight:900;margin:15px 0 5px}
.en{font-size:40px;font-weight:900;color:#0b5ed7;margin:5px 0}
.pron{background:#e9e4da;display:inline-block;padding:8px 20px;border-radius:20px;color:#555;margin:10px 0 20px}
.btns{display:flex;gap:10px;justify-content:center}
button{border:none;border-radius:15px;padding:15px 10px;font-size:18px;font-weight:bold;cursor:pointer;flex:1}
.next{background:#ff6a00;color:#fff}
.listen{background:#0b5ed7;color:#fff}
.prev{background:#ddd}
.counter{margin-top:20px;font-size:22px;font-weight:bold}
.camera{background:#111;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;margin:0 15px;padding:16px;border-radius:15px;font-size:18px;font-weight:bold;width:calc(100% - 30px)}
.note{text-align:center;margin:12px;color:#666;font-size:14px}
.bottom{display:flex;gap:10px;justify-content:center;margin-top:10px}
.bottom button{background:#fff;border:1px solid #ddd;padding:12px 20px}
#result{text-align:center;margin:15px;padding:10px;background:#fff;border-radius:12px;display:none}
#preview{max-width:90%;margin:10px auto;display:none;border-radius:12px}
</style>
</head>
<body>

<header>
  <h1>📚 موسوعة التلميذ النجيب</h1>
  <p>في اللغة الإنجليزية - تعلم، اسمع، اكتب</p>
</header>

<div class="card">
  <small>✨ الكلمة / الجملة اليوم</small>
  <div class="ar" id="arabic">كتاب</div>
  <div class="en" id="english">Book</div>
  <div class="pron" id="pron">بوك</div>
  <div class="btns">
    <button class="next" onclick="التالي()">التالي ▶</button>
    <button class="listen" onclick="اسمع_النطق()">🔊 اسمع<br>النطق</button>
    <button class="prev" onclick="السابق()">◀ السابق</button>
  </div>
  <div class="counter"><span id="current">1</span> / <span id="total">104</span></div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="ترجمة_الصورة(event)">
<button class="camera" onclick="document.getElementById('fileInput').click()">📸 التقط صورة لترجمتها</button>
<p class="note">صور أي كلمة بالعربية أو الإنجليزية وسنترجمها لك</p>
<img id="preview">
<div id="result"></div>

<div class="bottom">
  <button onclick="عرض_الكلمات()">📖 100 كلمة</button>
  <button onclick="عرض_الجمل()">💬 جمل</button>
</div>

<script>
// قائمة الكلمات - يمكنك إضافة 104 كلمة هنا
let الكلمات = [
  {ar:"كتاب", en:"Book", pron:"بوك"},
  {ar:"قلم", en:"Pen", pron:"بن"},
  {ar:"مدرسة", en:"School", pron:"سكول"},
  {ar:"بيت", en:"House", pron:"هاوس"},
  {ar:"شمس", en:"Sun", pron:"صن"},
  {ar:"قمر", en:"Moon", pron:"مون"},
  {ar:"ماء", en:"Water", pron:"ووتر"},
  {ar:"تفاحة", en:"Apple", pron:"آبل"},
  {ar:"قطة", en:"Cat", pron:"كات"},
  {ar:"كلب", en:"Dog", pron:"دوق"},
  {ar:"أمي", en:"Mother", pron:"ماذر"},
  {ar:"أبي", en:"Father", pron:"فاذر"},
];

let الجمل = [
  {ar:"أنا أحب مدرستي", en:"I love my school", pron:"آي لوف ماي سكول"},
  {ar:"هذا كتابي", en:"This is my book", pron:"ذيس إز ماي بوك"},
  {ar:"أين القلم؟", en:"Where is the pen?", pron:"وير إز ذا بن؟"},
];

let الوضع = "كلمات";
let الفهرس = 0;

function عرض(){
  let قائمة = الوضع === "كلمات" ? الكلمات : الجمل;
  let عنصر = قائمة[الفهرس];
  document.getElementById("arabic").innerText = عنصر.ar;
  document.getElementById("english").innerText = عنصر.en;
  document.getElementById("pron").innerText = عنصر.pron;
  document.getElementById("current").innerText = الفهرس + 1;
  document.getElementById("total").innerText = قائمة.length;
}
function التالي(){
  let قائمة = الوضع === "كلمات" ? الكلمات : الجمل;
  الفهرس = (الفهرس + 1) % قائمة.length;
  عرض();
}
function السابق(){
  let قائمة = الوضع === "كلمات" ? الكلمات : الجمل;
  الفهرس = (الفهرس - 1 + قائمة.length) % قائمة.length;
  عرض();
}
function عرض_الكلمات(){ الوضع="كلمات"; الفهرس=0; عرض(); }
function عرض_الجمل(){ الوضع="جمل"; الفهرس=0; عرض(); }

// الصوت الصحيح الذي يعمل في الهاتف وماسنجر
function اسمع_النطق(){
  let قائمة = الوضع === "كلمات" ? الكلمات : الجمل;
  let كلمة = قائمة[الفهرس].en;
  if (typeof responsiveVoice !== "undefined") {
    responsiveVoice.cancel();
    responsiveVoice.speak(كلمة, "UK English Female", {rate: 0.9});
  } else {
    // بديل إذا لم تحمل المكتبة
    let u = new SpeechSynthesisUtterance(كلمة);
    u.lang = "en-US";
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }
}

// ترجمة الصورة
async function ترجمة_الصورة(e){
  let file = e.target.files[0];
  if(!file) return;
  let img = document.getElementById("preview");
  img.src = URL.createObjectURL(file);
  img.style.display = "block";
  let res = document.getElementById("result");
  res.style.display = "block";
  res.innerText = "⏳ جاري قراءة الصورة...";
  try{
    let r = await Tesseract.recognize(file, 'ara+eng');
    let نص = r.data.text.trim();
    if(!نص){ res.innerText="لم نجد نصاً في الصورة، حاول صورة أوضح"; return; }
    // ترجمة
    let isArabic = /[\u0600-\u06FF]/.test(نص);
    let من = isArabic ? "ar" : "en";
    let إلى = isArabic ? "en" : "ar";
    let tr = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(نص)}&langpair=${من}|${إلى}`).then(x=>x.json());
    let ترجمة = tr.responseData.translatedText;
    res.innerHTML = `<b>النص:</b> ${نص}<br><b>الترجمة:</b> ${ترجمة}<br><br><button onclick="responsiveVoice.speak('${ترجمة.replace(/'/g,"")}','UK English Female')">🔊 اسمع الترجمة</button>`;
  }catch(err){ res.innerText="حدث خطأ، حاول مرة أخرى"; }
}

عرض();
</script>
</body>
</html>
